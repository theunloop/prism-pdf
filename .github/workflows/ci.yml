name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job here writes to the repository, and a fork's pull request must not be
# able to. Any job that ever needs more raises it in its own `permissions:` block.
permissions:
  contents: read

# Warnings are errors everywhere: rustc and clippy lints (incl. the workspace's
# unwrap_used/expect_used no-panic policy, DESIGN.md §3.4) fail the build.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Enforce Rust source-size budgets
        run: python3 scripts/check_rust_file_size.py
      # A path dependency resolves by path, so a stale `version` requirement in
      # [workspace.dependencies] breaks nothing until `cargo publish` reads it.
      - name: Check internal version requirements
        run: python3 scripts/workspace_version.py --check
      - run: cargo clippy --workspace --all-targets --all-features

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    # Warnings are errors here too. Besides catching broken links, this enforces the one-way
    # dependency graph (DESIGN.md §4): documenting an item from a crate you do not depend on is
    # an unresolved intra-doc link, so the build fails.
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  bench:
    name: benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo bench -p prismpdf-document --bench document_operations --
          --noplot --sample-size 10 --warm-up-time 1 --measurement-time 1
      - run: >-
          cargo bench -p prismpdf-layout --bench composition --
          --noplot --sample-size 10 --warm-up-time 1 --measurement-time 1

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    # Clear the global "-D warnings": cargo-fuzz manages RUSTFLAGS for sanitizer instrumentation,
    # and the (uncontrolled) warning state of instrumented dependencies must not fail the build.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # Two target dirs: the fuzz targets build into `fuzz/target`, but the seed-corpus step
      # below runs an example from the root workspace, which builds into `./target`. Caching
      # only `fuzz` leaves that a cold full-workspace build on every run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      # Built from source on the runner's own toolchain, not fetched prebuilt. cargo-fuzz
      # defaults `--target` to the triple it was itself compiled for, and the prebuilt binary
      # `taiki-e/install-action` ships is `x86_64-unknown-linux-musl`. That made the smoke run
      # below build every target for musl, which fails twice over: the target is not installed,
      # and a statically linked libc is incompatible with `-Zsanitizer=address`. Compiling here
      # keeps the default target `x86_64-unknown-linux-gnu`, which the sanitizers need.
      - run: cargo install cargo-fuzz --locked
      # Real PDFs to seed the whole-document targets so a smoke run reaches the deep parsers
      # (content/fonts/images), not just the header/xref rejection path.
      - name: Generate a seed corpus
        run: cargo run --quiet -p prismpdf --example gen_corpus -- /tmp/seeds
      # A bounded smoke run per target — enough to catch a regression (a crash/hang on hostile
      # input, DESIGN.md §3.4) on every PR, not a full continuous campaign. Every target the
      # harness defines is run, so new ones are covered automatically.
      - name: Smoke-run every fuzz target
        run: |
          set -euo pipefail
          for target in $(cargo +nightly fuzz list); do
            echo "::group::fuzz $target"
            # Seed the targets that consume a whole PDF from the generated corpus.
            case "$target" in
              document|lexer|parser)
                mkdir -p "fuzz/corpus/$target"
                cp -r /tmp/seeds/*/. "fuzz/corpus/$target/" 2>/dev/null || true
                ;;
            esac
            cargo +nightly fuzz run "$target" -- -max_total_time=25 -rss_limit_mb=4096
            echo "::endgroup::"
          done

  pdfa:
    name: PDF/A conformance (veraPDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      # DejaVu gives the example a real embeddable font for the text/2U sample.
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Generate the PDF/A corpus
        run: cargo run -p prismpdf --example gen_pdfa -- "$GITHUB_WORKSPACE/pdfa-corpus"

      - name: Install veraPDF
        run: |
          set -euo pipefail
          curl -fsSL -o verapdf-installer.zip https://software.verapdf.org/releases/verapdf-installer.zip
          unzip -q verapdf-installer.zip
          installer="$(find . -name verapdf-install -type f | head -1)"
          # IzPack auto-install descriptor: install into ~/verapdf.
          cat > "$PWD/auto-install.xml" <<XML
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
              <installpath>${HOME}/verapdf</installpath>
            </com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF Mac and *nix Installer" selected="true"/>
              <pack index="1" name="veraPDF GUI" selected="true"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.SimpleFinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          # verapdf-install cd's into its own directory before launching the JVM, so the
          # descriptor has to be an absolute path.
          "$installer" "$PWD/auto-install.xml"
          echo "$HOME/verapdf" >> "$GITHUB_PATH"

      - name: Validate (exit non-zero on any non-conformant file)
        run: |
          set -euo pipefail
          verapdf --version
          # Every generated PDF/A PASS file at its own declared flavour (the conformance code is
          # in the filename: prismpdf-<feature>-<flavour>-pass.pdf, see gen_pdfa's `name()`).
          # Codes: 1a/1b, 2a/2b/2u, 3a/3b/3u (part+level) and 4/4e/4f (part 4 has no levels).
          for f in "$GITHUB_WORKSPACE"/pdfa-corpus/prismpdf-*-pass.pdf; do
            case "$f" in *-ua1-pass.pdf|*-ua2-pass.pdf) continue ;; esac
            flavour="$(basename "$f" | sed -E 's/^prismpdf-.*-([0-9][abuef]?)-pass\.pdf$/\1/')"
            verapdf --flavour "$flavour" "$f"
          done
          # PDF/UA-1 accessibility (M14.3 + the M22 UA-1 sub-phase surface).
          verapdf --flavour ua1 "$GITHUB_WORKSPACE"/pdfa-corpus/prismpdf-accessible-ua1-pass.pdf
          # PDF/UA-2 accessibility on PDF 2.0 (M22 core: make_pdfua2, FENote/Title, Ref links).
          verapdf --flavour ua2 "$GITHUB_WORKSPACE"/pdfa-corpus/prismpdf-accessible-ua2-pass.pdf

  verify:
    name: base-PDF cross-validation (M18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The independent-validator panel. veraPDF only judges PDF/A·UA·X, so base PDF 1.4–2.0 is
      # cross-validated by these consumers (agreement = the oracle). fonts-dejavu-core is unused
      # here but harmless; the authored matrix uses Standard-14.
      - run: sudo apt-get update && sudo apt-get install -y qpdf mupdf-tools ghostscript poppler-utils

      - name: Install pdfcpu (not in apt)
        run: |
          set -euo pipefail
          V=0.13.0
          curl -fsSL -o /tmp/pdfcpu.txz \
            "https://github.com/pdfcpu/pdfcpu/releases/download/v${V}/pdfcpu_${V}_Linux_x86_64.tar.xz"
          tar xJf /tmp/pdfcpu.txz -C /tmp
          mkdir -p tools/verify
          cp "$(find /tmp -name pdfcpu -type f | head -1)" tools/verify/pdfcpu
          chmod +x tools/verify/pdfcpu

      # corpus/{valid,edge,malformed} are committed and regenerated here deterministically by
      # gen_corpus (corpus/external is the gitignored one); the 1.4–2.0 authored matrix is
      # generated by the test itself into target/verify-samples.
      - name: Generate the base corpus
        run: cargo run -q -p prismpdf --example gen_corpus

      - name: Cross-validate authored output (panel + version-boundary gate)
        run: cargo test -p prismpdf --test verify_base -- --nocapture
