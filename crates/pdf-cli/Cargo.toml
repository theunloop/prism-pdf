[package]
name = "prismpdf-cli"
description = "Prism PDF command-line tool: inspect, merge, split, extract (EPIC 15)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

# The command implementations live in the library so integration tests can drive them in-process
# (see `src/lib.rs`); `src/main.rs` is only argv → `Cli` → `run` → exit code.
[lib]
name = "pdf_cli"
path = "src/lib.rs"

[[bin]]
name = "prismpdf"
path = "src/main.rs"

[dependencies]
prismpdf.workspace = true
clap.workspace = true
