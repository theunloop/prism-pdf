# cbindgen configuration for the Prism PDF C ABI header (EPIC 10, DESIGN.md §6.1).
# Regenerate the header with:  cbindgen --config cbindgen.toml --crate prismpdf-ffi --output include/prismpdf.h
language = "C"
include_guard = "PRISMPDF_H"
pragma_once = false
cpp_compat = true
tab_width = 4
style = "type"
documentation = true
documentation_style = "doxy"
header = "/* Prism PDF — stable C ABI. Generated by cbindgen; do not edit by hand. */"
autogen_warning = "/* Generated by cbindgen. Edit the Rust source in crates/pdf-ffi and regenerate. */"

# Borrowed collection items are `#[repr(transparent)]` newtypes over facade types cbindgen cannot
# see (`Annotation`, `FormField`, `OutlineItem`), so it would emit `typedef Annotation
# PrismPdfAnnotation;` — an alias to a type that does not exist in C. They are only ever handled
# behind a pointer, so exclude the generated aliases and forward-declare them as opaque instead.
after_includes = """
/* Borrowed collection items — opaque, obtained from the matching *_list_get and never freed. */
typedef struct PrismPdfAnnotation PrismPdfAnnotation;
typedef struct PrismPdfFormField PrismPdfFormField;
typedef struct PrismPdfOutlineItem PrismPdfOutlineItem;
typedef struct PrismPdfAttachment PrismPdfAttachment;
typedef struct PrismPdfFont PrismPdfFont;
typedef struct PrismPdfImage PrismPdfImage;
typedef struct PrismPdfSignature PrismPdfSignature;
"""

[export]
prefix = ""
exclude = ["PrismPdfAnnotation", "PrismPdfFormField", "PrismPdfOutlineItem",
           "PrismPdfAttachment", "PrismPdfFont", "PrismPdfImage", "PrismPdfSignature"]

[enum]
prefix_with_name = true
